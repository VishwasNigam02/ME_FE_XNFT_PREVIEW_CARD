<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equilibrium #3429</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="card">
    <a class="card__images" href="#" aria-label="View Equilibrium #3429">
      <img
        src="./assets/image-equilibrium.jpg"
        alt="Equilibrium NFT"
        class="card__images-image"
      />
      <span class="card__images-layer" aria-hidden="true">
        <img src="./assets/icon-view.svg" alt="" />
      </span>
    </a>

    <section class="card__content">
      <div class="card__title">
        <h1>Equilibrium #3429</h1>
    </div>

      <p class="card__information">
        Our Equilibrium collection promotes balance and calm.
      </p>

      <div class="card__time">
        <div class="card__time-left">
          <img src="./assets/icon-ethereum.svg" alt="Ethereum" />
          <span>0.041 ETH</span>
        </div>

        <div class="card__time-right">
          <img src="./assets/icon-clock.svg" alt="Time remaining" />
          <span>3 days left</span>
        </div>
      </div>

      <div class="card__creator">
        <img src="./assets/logo.jpeg" alt="Creator avatar" />
        <p>Creation of <a href="https://github.com/ImKetan1610" target="_blank" rel="noopener noreferrer">Ketan Makode</a></p>
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio.Do</a>.
    Coded by
    <a href="https://www.github.com/VishwasNigam02" target="_blank" rel="noopener noreferrer">Vishwas Nigam</a>.
  </footer>
</body>
</html>
